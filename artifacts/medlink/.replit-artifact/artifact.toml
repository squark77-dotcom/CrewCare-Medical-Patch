kind = "mobile"
previewPath = "/"
title = "CREWCARE patch checklist"
version = "1.0.0"
id = "artifacts/medlink"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21073

[services.development]
run = "pnpm --filter @workspace/medlink run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medlink", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/medlink", "run", "serve" ]

[services.env]
PORT = "21073"
BASE_PATH = "/"
